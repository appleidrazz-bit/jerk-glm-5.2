services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fundarb-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    networks: [fundarb]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: fundarb-frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    networks: [fundarb]

  nginx:
    image: nginx:1.27-alpine
    container_name: fundarb-nginx
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [fundarb]

networks:
  fundarb:
    driver: bridge
